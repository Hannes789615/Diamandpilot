name: Build DiamondPilot

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Check out source
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.7.1'
  - name: Check project files
    run: |
      test -f build.gradle
      test -f settings.gradle
      test -f gradle.properties
      test -f src/main/resources/fabric.mod.json
  - name: Build mod
    run: gradle --no-daemon clean build
  - name: Upload mod JAR
    uses: actions/upload-artifact@v4
    with:
      name: DiamondPilot-build
      path: build/libs/*.jar
      if-no-files-found: error
